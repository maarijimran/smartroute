<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartRoute</title>
<script>
(function () {
  var t = new URLSearchParams(location.search).get("theme");
  try { if (t !== "light" && t !== "dark") t = localStorage.getItem("sr-proto-theme"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/* Light: warm ivory with terracotta */
:root {
  color-scheme: light;
  --bg: #faf9f5; --side: #f5f4ed; --side-on: #e8e6dc; --card: #ffffff; --bubble: #f0eee6; --menu-hover: #f0eee6;
  --ink: #141413; --ink2: #3d3d3a; --muted: #73726c; --faint: #9c9a92; --line: #e5e2d8; --hover: #f0eee6;
  --accent: #d97757; --brand: #c96442; --brand-h: #ae5630; --brand-50: #faeee8; --brand-ink: #ae5630;
  --primary: #141413; --primary-fg: #faf9f5;
  --ok-bg: #dceddf; --ok-ink: #265e3c; --warn-bg: #f6eacc; --warn-ink: #855612; --bad-bg: #f7deda; --bad-ink: #8c2a22; --mute-bg: #f0eee6; --mute-ink: #3d3d3a;
  --chart-main: #c96442; --chart-muted: #9c9a92; --chart-grid: #e5e2d8; --chart-axis: #73726c;
  --shadow: 0 2px 12px rgba(0,0,0,.04); --menu-shadow: 0 8px 28px rgba(0,0,0,.12);
  --serif: ui-serif, Georgia, Cambria, "Times New Roman", serif;
}
/* Dark: warm charcoal with terracotta */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #262624; --side: #1f1e1d; --side-on: #141413; --card: #30302e; --bubble: #141413; --menu-hover: #3a3a37;
  --ink: #faf9f5; --ink2: #c2c0b6; --muted: #9c9a92; --faint: #85837d; --line: #3e3e38; --hover: #1f1e1d;
  --accent: #d97757; --brand: #d97757; --brand-h: #e89578; --brand-50: #3a2820; --brand-ink: #e89578;
  --primary: #faf9f5; --primary-fg: #141413;
  --ok-bg: #223628; --ok-ink: #86c89c; --warn-bg: #403218; --warn-ink: #e6be6e; --bad-bg: #482420; --bad-ink: #f09688; --mute-bg: #1f1e1d; --mute-ink: #c2c0b6;
  --chart-main: #d97757; --chart-muted: #85837d; --chart-grid: #3e3e38; --chart-axis: #9c9a92;
  --shadow: none; --menu-shadow: 0 8px 28px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
input[type=checkbox] { accent-color: var(--brand); }
.ic { display: block; flex-shrink: 0; }
.grow { flex: 1; min-width: 0; }
.rel { position: relative; }
.serif { font-family: var(--serif); }
.faint { color: var(--faint); } .accent { color: var(--brand); }
.small { font-size: 12px; color: var(--muted); }
.mono { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 12.5px; }
.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* shell */
.app { display: flex; height: 100vh; }
main { flex: 1; min-width: 0; overflow: hidden; position: relative; }
.side { width: 288px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.rail { width: 52px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
.side-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px; }
.wordmark { font-family: var(--serif); font-size: 19px; letter-spacing: -.2px; }
.demo-tag { font-size: 10px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
.icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--muted); transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--side-on); color: var(--ink); }
main .icon-btn:hover { background: var(--hover); }
.icon-btn.bordered { border: 1px solid var(--line); }
.icon-btn.sm { width: 28px; height: 28px; }
.icon-btn.on { background: var(--hover); color: var(--ink); }
.icon-btn.on .fillable { fill: currentColor; }
.new-dot { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; }
.new-dot.sm { width: 24px; height: 24px; margin: 0; }
.newchat { display: flex; align-items: center; gap: 10px; margin: 0 8px; padding: 6px 8px; border-radius: 8px; color: var(--brand-ink); font-weight: 600; text-align: left; }
.newchat:hover { background: var(--side-on); }
.recents { flex: 1; overflow-y: auto; padding: 12px 8px 8px; scrollbar-width: thin; }
.sec { font-size: 12px; color: var(--muted); padding: 0 8px 4px; font-weight: 500; }
.chat-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; color: var(--ink2); cursor: pointer; text-decoration: none; }
.chat-item:hover, .chat-item.on { background: var(--side-on); }
.chat-item.on { color: var(--ink); }
.faint-txt { font-size: 13px; color: var(--faint); padding: 6px 8px; }
.side-foot { border-top: 1px solid var(--line); padding: 8px; }
.acct-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 8px; text-align: left; }
.acct-btn.compact { width: auto; padding: 4px; }
.acct-btn:hover { background: var(--side-on); }
.acct-btn b { display: block; font-weight: 600; font-size: 13.5px; }
.acct-btn small { display: block; font-size: 12px; color: var(--muted); text-transform: capitalize; }
.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--ink2); color: var(--bg); font-weight: 600; flex-shrink: 0; }

/* menus */
.menu { position: absolute; z-index: 60; min-width: 208px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: var(--menu-shadow); font-size: 13.5px; }
.menu.up { bottom: calc(100% + 8px); left: 0; }
.menu.up-right { bottom: calc(100% + 8px); right: 0; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; color: var(--ink2); text-align: left; }
.menu-item:hover { background: var(--menu-hover); }
.menu-item .sub { display: block; font-size: 12px; color: var(--muted); }
.menu-label { font-size: 12px; color: var(--muted); padding: 4px 10px 4px; }
.sep { height: 1px; background: var(--line); margin: 4px 0; }
.opt-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 10px; border-radius: 8px; color: var(--ink2); }
.switch { width: 36px; height: 20px; border-radius: 999px; background: var(--faint); position: relative; transition: background .15s; flex-shrink: 0; }
.switch span { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
.switch.on { background: var(--brand); } .switch.on span { left: 18px; }
.switch:disabled { opacity: .5; cursor: not-allowed; }

/* chat */
.greet-wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px 12vh; }
.greet { display: flex; align-items: center; gap: 12px; font-family: var(--serif); font-weight: 400; font-size: 40px; letter-spacing: -.5px; color: var(--ink2); margin: 0 0 32px; }
.greet-composer { width: 100%; max-width: 672px; }
.thread-wrap { height: 100%; display: flex; flex-direction: column; }
.chat-head { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.chat-title { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 8px; font-size: 14px; color: var(--ink2); max-width: 60%; }
.chat-title:hover { background: var(--hover); }
.msgs { flex: 1; overflow-y: auto; scrollbar-width: thin; }
.col { max-width: 768px; margin: 0 auto; padding: 0 16px; }
.msgs .col { padding-top: 12px; padding-bottom: 32px; }
.composer-wrap { width: 100%; padding-bottom: 16px; flex-shrink: 0; }
.m-user { display: flex; justify-content: flex-end; padding: 12px 0; }
.m-user .bubble { max-width: 85%; background: var(--bubble); border-radius: 18px; padding: 10px 16px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
.m-bot { padding: 12px 0; }
.answer { font-family: var(--serif); font-size: 16.5px; line-height: 1.7; white-space: pre-wrap; color: var(--ink); }
.caret { display: inline-block; width: 8px; height: 16px; border-radius: 2px; background: var(--accent); vertical-align: middle; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.thinking { padding: 6px 0; color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.refusal { display: flex; gap: 10px; border-radius: 12px; padding: 12px 16px; background: var(--warn-bg); color: var(--warn-ink); font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.actions .meta { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: 8px; }
.actions .mname { color: var(--ink2); }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 1px 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.b-local, .b-ok { background: var(--ok-bg); color: var(--ok-ink); } .b-cheap, .b-mute { background: var(--mute-bg); color: var(--mute-ink); }
.b-strong, .b-brand { background: var(--brand-50); color: var(--brand-ink); } .b-bad { background: var(--bad-bg); color: var(--bad-ink); } .b-warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500; background: var(--mute-bg); color: var(--mute-ink); white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); } .pill.brand { background: var(--brand-50); color: var(--brand-ink); }
.pill button { margin-right: -4px; padding: 2px; border-radius: 50%; color: inherit; } .pill button:hover { background: rgba(0,0,0,.08); }
.why { margin-top: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: 12.5px; color: var(--ink2); display: grid; grid-template-columns: 1fr 1.15fr; gap: 18px; }
.why h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.kv { display: grid; grid-template-columns: 72px 1fr; gap: 5px 10px; }
.kv b { color: var(--ink); font-weight: 600; }
.funnel { list-style: none; margin: 0; padding: 0; }
.funnel li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.dot.y { background: var(--ok-bg); color: var(--ok-ink); } .dot.n { background: var(--mute-bg); color: var(--faint); } .dot.c { background: var(--brand); color: #fff; }
.composer { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 12px 10px; box-shadow: var(--shadow); }
.composer:focus-within { border-color: var(--faint); }
.composer textarea { display: block; width: 100%; border: 0; outline: 0; background: transparent; resize: none; font-size: 15px; line-height: 1.6; padding: 4px 6px; max-height: 240px; }
.composer textarea::placeholder { color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 4px 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; max-width: 260px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--ink2); }
.chip button { color: var(--faint); border-radius: 4px; padding: 2px; } .chip button:hover { color: var(--ink); background: var(--hover); }
.c-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.model-btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 8px; color: var(--ink2); font-size: 13.5px; }
.model-btn:hover { background: var(--hover); }
.send { width: 32px; height: 32px; border-radius: 8px; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; transition: background .15s, opacity .15s; }
.send:hover { background: var(--brand-h); } .send:disabled { opacity: .4; cursor: default; }
.attach { display: flex; justify-content: flex-end; align-items: flex-start; gap: 12px; padding: 12px 0; }
.attach .file { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; width: 300px; flex-shrink: 0; }
.attach .file svg { display: block; width: 100%; height: auto; border-radius: 8px; }
.attach .fname { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; padding: 0 2px; }
.ocrbox { flex: 1; max-width: 420px; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: var(--ink2); }
.ocrbox pre { margin: 6px 0 0; white-space: pre-wrap; font: 11.5px/1.5 Consolas, "Cascadia Mono", Menlo, monospace; color: var(--ink); }
.ocrbox mark { background: var(--brand-50); color: var(--brand-ink); border-radius: 3px; padding: 0 2px; }

/* settings */
.settings { height: 100%; overflow-y: auto; scrollbar-width: thin; }
.s-inner { max-width: 1120px; margin: 0 auto; padding: 40px 32px 240px; }
.s-title { font-family: var(--serif); font-weight: 400; font-size: 32px; letter-spacing: -.4px; margin: 0 0 28px; }
.s-body { display: flex; gap: 32px; }
.tabs { width: 168px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }
.tabs .tsec { font-size: 12px; color: var(--muted); padding: 18px 12px 4px; font-weight: 500; }
.tabs a { display: block; padding: 6px 12px; border-radius: 8px; color: var(--ink2); text-decoration: none; cursor: pointer; }
.tabs a:hover { background: var(--hover); }
.tabs a.on { background: var(--hover); color: var(--ink); font-weight: 600; }
.s-content { flex: 1; min-width: 0; }
.h2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
.h2 h2 { font-size: 18px; font-weight: 600; margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.card > header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 4px; font-weight: 600; font-size: 15px; }
.card > .body { padding: 12px 20px 20px; }
.card > table { margin-top: 8px; }
.grid { display: grid; gap: 16px; } .grid > * { min-width: 0; }
.g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); }
.mt { margin-top: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; padding: 8px 14px; font-weight: 500; font-size: 13.5px; background: var(--primary); color: var(--primary-fg); }
.btn:hover { opacity: .88; }
.btn.sec { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.sec:hover { background: var(--hover); opacity: 1; }
.input, select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--card); outline: none; }
.input:focus, select:focus { border-color: var(--faint); }
select:disabled, .input:disabled { opacity: .7; }
label.fld { display: block; } label.fld > span { display: block; font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 6px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink2); }
tr:last-child td { border-bottom: 0; }
tr.new td { animation: flash 2.2s ease-out; }
@keyframes flash { from { background: var(--brand-50); } to { background: transparent; } }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 0; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--card); padding: 7px 14px; font-size: 13px; color: var(--ink2); }
.seg button.on { background: var(--primary); color: var(--primary-fg); font-weight: 500; }
.seg button:disabled { cursor: not-allowed; }
.notice { border-radius: 8px; padding: 10px 12px; font-size: 13px; background: var(--warn-bg); color: var(--warn-ink); }
.stat { padding: 14px 16px; }
.stat .k { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.stat .v { font-size: 26px; font-weight: 600; margin-top: 2px; }
.stat .n { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chart { position: relative; } .chart svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 7px 9px; border-radius: 8px; white-space: nowrap; display: none; z-index: 5; }
.linkbtn { color: var(--brand-ink); font-weight: 500; font-size: 13px; }
pre.code { margin: 0; background: #1f1e1d; color: #e8e6dc; border: 1px solid #3e3e38; border-radius: 10px; padding: 14px 16px; overflow-x: auto; font: 12.5px/1.55 Consolas, "Cascadia Mono", Menlo, monospace; }
pre.code.wrap { white-space: pre-wrap; word-break: break-word; max-height: 400px; }
pre.code .k { color: #e89578; } pre.code .s { color: #a8d5b5; }
.mode-card { text-align: center; }
.mode-card .sw { height: 64px; border-radius: 12px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; }
.mode-card.on .sw { outline: 2px solid var(--brand); outline-offset: 2px; }
.mode-card .sw span { width: 28px; height: 28px; border-radius: 50%; background: #d97757; color: #fff; display: grid; place-items: center; }
.mode-card div { margin-top: 8px; font-size: 13.5px; color: var(--ink2); }

/* login */
.login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 10vh; position: relative; }
.login .brandline { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; color: var(--ink); }
.login .brandline span.wm { font-family: var(--serif); font-size: 30px; letter-spacing: -.4px; }
.login h1 { font-family: var(--serif); font-weight: 400; font-size: 40px; letter-spacing: -.5px; margin: 0 0 28px; color: var(--ink2); }
.acct { display: grid; grid-template-columns: repeat(3, 200px); gap: 14px; }
.acct button { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); }
.acct button:hover { border-color: var(--faint); }
.acct b { display: block; font-weight: 600; } .acct small { color: var(--muted); text-transform: capitalize; }
.corner { position: absolute; top: 18px; right: 22px; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; padding: 6px 10px; border-radius: 8px; }
.corner:hover { background: var(--hover); color: var(--ink); }

/* presenter steps panel */
.tour { position: fixed; left: 12px; bottom: 74px; width: 264px; background: #1f1e1d; color: #c2c0b6; border: 1px solid #3e3e38; border-radius: 14px; box-shadow: 0 16px 36px rgba(0,0,0,.3); z-index: 50; }
.tour.min .tbody { display: none; }
.tour .thead { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #3e3e38; font-size: 12px; }
.tour .thead b { color: #faf9f5; font-weight: 600; }
.tour .tbody { padding: 10px 12px 12px; }
.tour h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 19px; color: #faf9f5; }
.tour .prog { height: 3px; background: #3e3e38; border-radius: 3px; margin: 10px 0; overflow: hidden; }
.tour .prog > div { height: 100%; background: #d97757; transition: width .3s; }
.tour .ctl { display: flex; gap: 8px; justify-content: flex-end; }
.tour .tb { border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; background: #d97757; color: #fff; }
.tour .tb.sec { background: transparent; color: #c2c0b6; border: 1px solid #3e3e38; }
.tour .tb:disabled { opacity: .5; cursor: default; }
.tour .x { color: #9c9a92; font-size: 12px; }
.spot { outline: 2px solid var(--accent) !important; outline-offset: 3px; border-radius: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<div class="tour" id="tour"></div>

const STOP = new Set("a an and are as at be by for from has have in is it its of on or that the this to was were will with".split(" "));
const tokenize = (t) => (t.toLowerCase().match(/[a-z0-9]+/g) || []).filter((w) => !STOP.has(w));
const countTokens = (t) => Math.ceil((t || "").length / 3.6);
const countMessages = (ms) => ms.reduce((n, m) => n + countTokens(m.content) + 4, 0) + 2;
const RX_SUMMARY = /\b(summar(?:y|ise|ize|ies)|tl;?dr|overview of|key points|main points|abstract of)\b/i;
const RX_EXPLAIN = /\b(explain|define|definition|what (?:is|are|does)|meaning of|in simple terms|describe)\b/i;
const RX_HARD = /\b(prove|derive|derivation|compare|contrast|analy[sz]e|evaluate|critique|justify|trade-?offs?|why does|why is|step by step|multi-?step|implications?|limitations?|robust|synthesi[sz]e)\b/gi;
const RX_EASY = /\b(define|definition|what is|list|name|who|when|which year|how many)\b/gi;
function explicitTask(p) { if (RX_SUMMARY.test(p)) return "summary"; if (RX_EXPLAIN.test(p)) return "explain"; return null; }
function classifyTask(p, hasDoc) { if (RX_SUMMARY.test(p)) return "summary"; if (hasDoc) return "doc_qa"; if (RX_EXPLAIN.test(p)) return "explain"; return "chat"; }
function complexity(p, inTok) {
  const hard = (p.match(RX_HARD) || []).length, easy = (p.match(RX_EASY) || []).length;
  let s = 0.25 + 0.12 * Math.min(hard, 3) - 0.10 * Math.min(easy, 2) + 0.08 * Math.max((p.match(/\?/g) || []).length - 1, 0);
  s += 0.10 * Math.min(Math.log1p(p.split(/\s+/).length) / Math.log1p(120), 1);
  s += 0.10 * Math.min(Math.log1p(inTok) / Math.log1p(8000), 1);
  return Math.min(Math.max(s, 0), 1);
}
const GENERIC = new Set(("why how what which who whom whose when where more less example examples explain explained elaborate mean means meaning detail details detailed shorter simpler longer short simple long again else sure ok okay please thanks thank yes no does do did can could would should will give tell me show about so then also further continue go on make rewrite rephrase summarise summarize briefly simply instead other another one ones point points part parts").split(/\s+/));
const RX_ANAPHORA = /\b(?:it|its|this|that|these|those|they|them|their|above|previous|earlier|same|former|latter|the (?:first|second|third|last|other) (?:one|method|approach|point|paper|model|result|step|part|option))\b/i;
const RX_CONNECTOR = /^\s*(?:and|also|but|then|instead|what about|how about|what else|and what about)\b/i;
const RX_FOLLOW = /^\s*(?:so|ok(?:ay)?|why|how so|in what way|more|elaborate|expand|continue|go on|tell me more|explain (?:that|this|it|them|more|further)|make it|rewrite|rephrase|shorten|simplify|shorter|simpler|longer|give (?:me )?(?:an? )?examples?|what does (?:that|this|it) mean)\b/i;
function isFollowUp(q, pq, pa) {
  if (!pq) return false;
  const words = tokenize(q), seen = new Set([...tokenize(pq), ...tokenize(pa)]);
  const novel = words.filter((w) => !GENERIC.has(w) && !seen.has(w));
  if (!novel.length) return true;
  if (RX_ANAPHORA.test(q) && words.length <= 10) return true;
  if (RX_CONNECTOR.test(q) && novel.length <= 3) return true;
  if (RX_FOLLOW.test(q) && novel.length <= 1) return true;
  return false;
}
function luhn(d) { let t = 0, p = d.length % 2; for (let i = 0; i < d.length; i++) { let x = +d[i]; if (i % 2 === p) { x *= 2; if (x > 9) x -= 9; } t += x; } return t % 10 === 0; }

  add("NATIONAL_ID", /(?<!\d)(?<!\d\.)[1-7]\d{12}(?!\d)(?!\.\d)/g);
  add("PHONE", /(?<![\d+])(?:\+92|0092|0)[ -]?3\d{2}[ -]?\d{7}(?!\d)/g);

function plan({ user, session, text, consent, confidential, pinned, models = S.models, source = "chat" }) {
  const history = session ? session.messages.filter((m) => m.role === "user" || (m.role === "assistant" && m.meta.status === "ok")).map((m) => ({ role: m.role, content: m.content })) : [];
  let pq = "", pa = "";
  for (let i = history.length - 1; i >= 0; i--) if (history[i].role === "user") { pq = history[i].content; pa = history.slice(i + 1).filter((m) => m.role === "assistant").map((m) => m.content).join(" "); break; }
  const follow = isFollowUp(text, pq, pa);
  const docs = session ? S.docs.filter((d) => session.docs.includes(d.id)) : [];
  const hasDoc = docs.length > 0;
  const task = explicitTask(text) || classifyTask(follow ? pq : text, hasDoc);
  const histTok = countMessages(history);
  const historyMode = !history.length ? "none" : histTok <= S.policy.history_budget ? "full" : (S.policy.summary ? "summary" : "relevant");
  const cap = CAPS[task] || 1024;
  const inTok = Math.round((countTokens(text) + Math.min(histTok, S.policy.history_budget) + (hasDoc ? S.policy.retrieval_k * 270 : 0) + 60) * 1.1);
  const outTok = Math.round(cap / 2);
  let cx = complexity(text, inTok);
  if (follow) cx = Math.max(cx, complexity(pq, inTok));
  const docText = docs.map((d) => d.text || "");
  const scanned = [text, ...history.map((m) => m.content), ...docText].join("\n");
  const findings = detect(text);
  const otherFindings = detect([...history.map((m) => m.content), ...docText].join("\n"));
  const triggers = [];
  if (findings.length || otherFindings.length) triggers.push("pii_detected");
  if (docs.some((d) => d.label === "confidential")) triggers.push("confidential_document");
  if (confidential) triggers.push("explicit_label");
  if (session && session.confidential) triggers.push("session_label");
  const sensitive = triggers.length > 0;
  const types = [...new Set([...findings, ...otherFindings].map((f) => f.type))].sort();
  const mode = session ? session.mode : "cloud_allowed";
  const perm = decideCloud(user, mode, sensitive, consent);
  const routes = [], exclusions = {};
  for (const m of models) {
    if (!m.enabled) continue;
    if (!m.local && !perm.allowed) { exclusions[m.name] = "privacy:" + perm.reason; continue; }
    if (inTok + Math.min(cap, m.maxout) > m.ctx) { exclusions[m.name] = "context_window"; continue; }
    routes.push({ ...m, est: (inTok * m.pin + outTok * m.pout) / 1e6 });
  }
  let decision = null, abstain = null, rule = "";
  if (pinned) {
    const r = routes.find((x) => x.name === pinned);
    if (r) { decision = r; rule = "Chosen by user"; } else abstain = `${pinned} not eligible.`;
  } else if (routes.length) {
    let order, why;
    if (task === "explain" && inTok < 300) { order = ["local", "cheap", "strong"]; why = "Short explanation"; }
    else if (cx >= 0.6 || inTok > 6000) { order = ["strong", "cheap", "local"]; why = "Complex"; }
    else if (task === "summary") { order = ["cheap", "local", "strong"]; why = "Summary"; }
    else { order = ["cheap", "strong", "local"]; why = "Default"; }
    for (const t of order) { const c = routes.filter((r) => r.tier === t).sort((a, b) => a.est - b.est)[0]; if (c) { decision = c; rule = `${why} → ${TIER[order[0]]}` + (t !== order[0] ? ` · fallback ${TIER[t]}` : ""); break; } }
  } else {
    abstain = !perm.allowed ? `${REFUSAL[perm.reason]} No local model available.` : "No eligible model.";
  }
  return { text, task, follow, historyMode, histCount: history.length, cx, inTok, outTok, sensitive, triggers, types, mode, perm, routes, exclusions, decision, abstain, rule, consent, source, models, preview: mask(text, findings).slice(0, 160), scanned };
}

  { re: /compare dropout and weight decay/i, text: "Both reduce overfitting, but in different ways.\n\n• Dropout randomly disables units during training, so no unit can rely on another; it adds noise to training.\n• Weight decay penalises large weights, which keeps the learned function smooth; it adds no noise.\n\nFor a small CNN on limited data, weight decay is usually the more robust default: one parameter, stable training, and it acts on every layer. Dropout helps most in the fully connected head." },
  { re: /^why\??$/i, text: "Because dropout's effect depends on the rate and on where it is placed, and in convolutional layers neighbouring activations are strongly correlated, so dropping single units removes little information. Weight decay acts evenly on every layer and needs no such tuning, which makes it the safer first choice." },

function startNewChat() {

  const doc = { id: nid(), name: "cnic_photo.png", label: "confidential", pages: 1, chunks: 1, ocr: true, text: OCR_TEXT };
  S.docs.unshift(doc);
  s.docs = [...s.docs.filter((id) => id !== doc.id), doc.id];
  const att = { id: nid(), role: "attachment", doc, meta: { status: "reading" } };
  s.messages.push(att);
  render();
  await sleep(1400);
  att.meta.status = "done";
  render();
  return att;
}
async function send(text, { consent = false, confidential = false, pinned = "" } = {}) {
  const s = activeSession() || newSession();
  if (!s.messages.some((m) => m.role === "user") && s.title === "New chat") s.title = text.slice(0, 48);
  const p = plan({ user: me(), session: s, text, consent, confidential, pinned });
  s.messages.push({ id: nid(), role: "user", content: text, meta: {} });
  if (p.sensitive) s.confidential = true;
  const bot = { id: nid(), role: "assistant", content: "", meta: { status: "streaming" }, plan: p };
  s.messages.push(bot);
  S.draftText = "";
  S.composer.consent = false; S.composer.confidential = false;
  render();
  const lat = p.decision ? Math.round(p.decision.lat * 1000 * (1 + p.inTok / 20000) * (0.9 + Math.random() * 0.2)) : 0;
  const cost = p.decision ? (p.inTok * p.decision.pin + p.outTok * 0.8 * p.decision.pout) / 1e6 : 0;
  if (p.sensitive) await addAudit(p, me());
  if (p.abstain) {
    bot.content = p.abstain; bot.meta = { status: "abstained" };
  } else {
    await sleep(450);
    const full = answerFor(p), words = full.split(/(\s+)/);
    for (let i = 0; i < words.length; i += 2) { bot.content += words[i] + (words[i + 1] || ""); if (i % 6 === 0) { renderThread(); await sleep(28); } }
    bot.content = full;
    bot.meta = { status: "ok", model: p.decision.name, latency: lat, cost, outTok: Math.round(p.outTok * 0.8) };
  }
  S.events.push({ t: now(), model: p.decision && !p.abstain ? p.decision.name : null, cost, inTok: p.inTok, outTok: Math.round(p.outTok * 0.8), sensitive: p.sensitive, status: bot.meta.status });
  render();
  return bot;
}

    decision: p.perm.allowed ? "cloud_allowed" : "cloud_blocked", reason: p.perm.reason, consent: p.consent,
    dest: p.decision ? p.decision.name : null, left: !!(p.decision && !p.decision.local),

}

function demoDays() {
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const out = [], today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 13; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const n = Math.round(42 + rnd() * 30), local = Math.round(n * (0.33 + rnd() * 0.1)), strong = Math.round(n * (0.15 + rnd() * 0.07)), cheap = n - local - strong;
    out.push({ date: d, n, local, cheap, strong, cost: cheap * 0.00035 + strong * 0.014, est: n * 0.014 });
  }
  return out;
}
function analyticsData() {
  const days = demoDays(), last = days[days.length - 1];
  for (const e of S.events.filter((x) => x.status === "ok")) { const m = S.models.find((x) => x.name === e.model); last.n++; last[m.tier]++; last.cost += e.cost; last.est += (e.inTok * 4 + e.outTok * 20) / 1e6; }
  const tot = days.reduce((a, d) => ({ n: a.n + d.n, local: a.local + d.local, cheap: a.cheap + d.cheap, strong: a.strong + d.strong, cost: a.cost + d.cost, est: a.est + d.est }), { n: 0, local: 0, cheap: 0, strong: 0, cost: 0, est: 0 });
  return { days, tot };
}
function lineChart(days) {
  const W = 560, H = 250, L = 52, R = 100, T = 14, B = 34;
  const peak = Math.max(...days.map((d) => d.est));
  const step = [0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 5, 10].find((s) => peak / s <= 5) || 10;
  const max = Math.ceil(peak / step) * step;
  const x = (i) => L + (i * (W - L - R)) / (days.length - 1), y = (v) => T + (H - T - B) * (1 - v / max);
  const path = (k) => days.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join("");
  const ticks = Array.from({ length: Math.round(max / step) + 1 }, (_, i) => i * step).map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--chart-grid)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--chart-axis)">$${v.toFixed(2)}</text>`).join("");
  const xl = days.map((d, i) => (i % 3 === 1 || i === days.length - 1 ? `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--chart-axis)">${d.date.toLocaleDateString([], { month: "short", day: "numeric" })}</text>` : "")).join("");
  const n = days.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily cost">
    ${ticks}${xl}
    <path d="${path("est")}" fill="none" stroke="var(--chart-muted)" stroke-width="2" stroke-dasharray="6 5"/>
    <path d="${path("cost")}" fill="none" stroke="var(--chart-main)" stroke-width="2"/>
    <circle cx="${x(n)}" cy="${y(days[n].est)}" r="4" fill="var(--chart-muted)" stroke="var(--card)" stroke-width="2"/>
    <circle cx="${x(n)}" cy="${y(days[n].cost)}" r="4" fill="var(--chart-main)" stroke="var(--card)" stroke-width="2"/>
    <text x="${x(n) + 10}" y="${y(days[n].est) + 4}" font-size="11.5" fill="var(--ink2)">Strong-only</text>
    <text x="${x(n) + 10}" y="${y(days[n].cost) + 4}" font-size="11.5" fill="var(--ink2)">Measured</text>
    <line id="xhair" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--chart-axis)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect id="lineHit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
}
function barChart(tot) {
  const rows = [["Llama 3.1 8B", "Local", tot.local], ["Claude Haiku 5.5", "Fast", tot.cheap], ["Claude Opus 5.5", "Strong", tot.strong]];
  const W = 420, H = 250, L = 14, T = 26, B = 46, bw = 84, gap = (W - L * 2 - bw * 3) / 2, max = Math.max(...rows.map((r) => r[2])) * 1.08;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Answers by model">

    ${rows.map(([label, tier, v], i) => { const x = L + i * (bw + gap), h = (H - T - B) * (v / max), yy = H - B - h; return `<g class="barg" data-tip="${esc(label)}: ${v} (${pct(v / tot.n)})">
      <path d="M${x},${H - B} V${yy + 4} Q${x},${yy} ${x + 4},${yy} H${x + bw - 4} Q${x + bw},${yy} ${x + bw},${yy + 4} V${H - B} Z" fill="var(--chart-main)"/>
      <rect x="${x - 4}" y="${T - 20}" width="${bw + 8}" height="${H - T - B + 20}" fill="transparent"/>

function bindAnalytics() {

      ${row("cloud_enabled", "Cloud")}${row("allow_default", "Confidential to cloud")}${row("require_consent", "Consent")}${row("exempt_names_public_docs", "Ignore names in public files")}
    </div></div>
    <div class="card"><header>Routing</header><div class="body">
      <div class="seg">${routers.map(([v, l]) => `<button data-router="${v}" class="${P.routing === v ? "on" : ""}" ${sup ? "" : "disabled"}>${l}</button>`).join("")}</div>
      ${P.routing !== "rules" ? '<div class="notice" style="margin-top:12px">Demo uses Rules</div>' : ""}
      <div class="grid g3" style="margin-top:14px">
        <label class="fld"><span>Quality</span><input class="input" value="0.5" disabled></label>
        <label class="fld"><span>Cost</span><input class="input" value="0.3" disabled></label>
        <label class="fld"><span>Latency</span><input class="input" value="0.2" disabled></label>
      </div>
    </div></div>
    <div class="card"><header>Context</header><div class="body">
      <label class="fld"><span>History (tokens)</span><input class="input" type="number" value="${P.history_budget}" ${sup ? "" : "disabled"} data-num="history_budget"></label>
      <div style="margin-top:8px">${row("summary", "Summaries")}</div>
    </div></div>
    <div class="card"><header>Limits</header><div class="body grid g2">
      <label class="fld"><span>Budget (USD/month)</span><input class="input" type="number" value="${P.budget}" ${sup ? "" : "disabled"} data-num="budget"></label>
      <label class="fld"><span>Expiry</span><input class="input" value="60 min" disabled></label>
      <label class="fld"><span>Metadata</span><input class="input" value="30 days" disabled></label>
      <label class="fld"><span>Audit</span><input class="input" value="365 days" disabled></label>
    </div></div>
  </div>
  <div class="card mt"><header>History</header>${changesTable()}</div>`;
}
function bindPolicy() {
  $$("[data-opt^=pol-]").forEach((c) => c.addEventListener("click", () => { const k = c.dataset.opt.slice(4); logChange("policy", k, S.policy[k], !S.policy[k]); S.policy[k] = !S.policy[k]; render(); }));
  $$("[data-router]").forEach((c) => c.addEventListener("click", () => { if (S.policy.routing === c.dataset.router) return; logChange("policy", "routing", S.policy.routing, c.dataset.router); S.policy.routing = c.dataset.router; render(); }));
  $$("[data-num]").forEach((c) => c.addEventListener("change", () => { const k = c.dataset.num; logChange("policy", k, S.policy[k], +c.value); S.policy[k] = +c.value; render(); }));
}

function modelsView() {
  return `${h2("Models")}
  <div class="card"><table><tr><th>Model</th><th>Provider</th><th>Tier</th><th>Price in / out</th><th>Context</th><th>Health</th><th>On</th></tr>
  ${S.models.map((m) => `<tr><td><b style="color:var(--ink);font-weight:500">${esc(m.display)}</b><div class="mono small">${m.name}</div></td><td>${m.vendor}</td><td><span class="badge ${TIER_BADGE[m.tier]}">${TIER[m.tier]}</span></td>
    <td>${m.local ? "Free" : `$${m.pin.toFixed(2)} / $${m.pout.toFixed(2)}`}<div class="small">3 Nov 2026</div></td><td>${m.ctx.toLocaleString()}</td>
    <td><span class="badge b-ok">OK</span></td><td>${sw("model-" + m.name, m.enabled)}</td></tr>`).join("")}
  </table></div>`;
}
function bindModels() { $$("[data-opt^=model-]").forEach((c) => c.addEventListener("click", () => { const m = S.models.find((x) => x.name === c.dataset.opt.slice(6)); m.enabled = !m.enabled; logChange("models", m.name, !m.enabled, m.enabled); render(); })); }

const VIEWS = { general: generalView, files: filesView, api: apiView, analytics: analyticsView, users: usersView, audit: auditView, policy: policyView, models: modelsView };
const BIND = { files: bindFiles, api: bindApi, analytics: bindAnalytics, users: bindUsers, policy: bindPolicy, models: bindModels };

/* ============================================================== demo steps (narration: README.md) */
async function typeAndSend(text, opts = {}) {
  const box = $("#box");
  if (!S.fast && box) {
    box.focus();
    for (let i = 1; i <= text.length; i++) { box.value = text.slice(0, i); S.draftText = box.value; await sleep(14); }
    const b = $("#sendBtn"); if (b) b.disabled = false;
    await sleep(150);
  }
  const bot = await send(text, opts);
  await sleep(250);
  return bot;
}
function spot(sel) { $$(".spot").forEach((e) => e.classList.remove("spot")); const el = typeof sel === "string" ? $(sel) : sel; if (el) { el.classList.add("spot"); el.scrollIntoView({ block: "nearest" }); } }
function login(acct) { S.account = acct; S.flash = null; S.menu = null; }
function openDetails(bot) { S.openWhy = bot.id; renderThread(); }
const HARD_Q = "Compare dropout and weight decay for regularising a small CNN, analyse the trade-offs step by step and justify which is more robust?";
const STEPS = [
  { title: "Sign in", run: async () => { login("user"); startNewChat(); go("chat"); } },
  { title: "Simple → Local", run: async () => { await typeAndSend("What is overfitting?"); } },
  { title: "Complex → Strong", run: async () => { openDetails(await typeAndSend(HARD_Q)); } },
  { title: "Follow-up", run: async () => { openDetails(await typeAndSend("Why?")); } },
  { title: "CNIC → Local", run: async () => { startNewChat(); render(); openDetails(await typeAndSend("Draft a short reply to the student about her grade appeal. Her CNIC is 42101-1234567-1.")); } },
  { title: "CNIC photo → OCR", run: async () => { startNewChat(); S.menu = "plus"; render(); spot("#photoItem"); await sleep(900); S.menu = null; await attachPhoto(); await typeAndSend("Fill in the admission form using the details on my attached card."); } },
  { title: "Audit", run: async () => { login("superadmin"); go("audit"); } },
  { title: "Grant access", run: async () => { go("users"); spot("#perm-u3"); await sleep(900); setPermission("u3", "allow"); render(); spot("#perm-u3"); } },
  { title: "Consent → Cloud", run: async () => { login("user"); startNewChat(); S.composer.consent = true; render(); spot("#consentPill"); await sleep(900); openDetails(await typeAndSend("Rewrite this note formally for the registrar: the student with CNIC 42101-1234567-1 requests a transcript.", { consent: true })); } },
  { title: "Local only", run: async () => { startNewChat(); S.draftMode = "local_only"; render(); spot("#localPill"); await sleep(900); openDetails(await typeAndSend(HARD_Q)); } },
  { title: "API", run: async () => { go("api"); S.apiOut = apiCall("cnic"); render(); await sleep(1600); S.apiOut = apiCall("nolocal"); render(); spot("#apiOut"); } },
  { title: "Analytics", run: async () => { go("analytics"); } },
  { title: "Policy", run: async () => { login("superadmin"); go("policy"); } },
];
let step = 0, running = false, tourMin = false;
function renderTour() {
  const el = $("#tour");
  if (new URLSearchParams(location.search).get("panel") === "0") { el.style.display = "none"; return; }
  const cur = STEPS[step - 1];
  el.className = "tour" + (tourMin ? " min" : "");
  el.innerHTML = `<div class="thead"><b>Steps</b><span>${step ? `${step} / ${STEPS.length}` : STEPS.length}</span><span class="grow"></span><button class="x" id="tmin">${tourMin ? "Show" : "Hide"}</button></div>
    <div class="tbody"><h3>${cur ? esc(cur.title) : "Walkthrough"}</h3>
    <div class="prog"><div style="width:${(step / STEPS.length) * 100}%"></div></div>
    <div class="ctl"><button class="tb sec" id="treset">Restart</button><button class="tb" id="tnext" ${running || step >= STEPS.length ? "disabled" : ""}>${running ? "…" : step >= STEPS.length ? "Done" : step ? "Next" : "Start"}</button></div></div>`;
  $("#tmin").onclick = () => { tourMin = !tourMin; renderTour(); };
  $("#treset").onclick = () => { location.href = location.pathname; };
  $("#tnext").onclick = next;
}
async function next() {
  if (running || step >= STEPS.length) return;
  running = true; step++; renderTour();
  try { await STEPS[step - 1].run(); } finally { running = false; renderTour(); }
}

/* ============================================================== start */
(async function start() {
  const params = new URLSearchParams(location.search);
  const upTo = Math.min(+params.get("step") || 0, STEPS.length);
  if (upTo) { S.fast = true; for (let i = 0; i < upTo; i++) { step = i; await next(); } S.fast = false; }
  const h = location.hash.slice(1);
  if (h && h !== "login" && S.account) screen = h;
  if (params.get("why") === "0") S.openWhy = null;
  if (params.get("menu")) S.menu = params.get("menu");
  if (params.get("sidebar") === "0") S.collapsed = true;
  render(); renderTour();
  $$(".spot").forEach((e) => e.classList.remove("spot"));
  document.body.dataset.ready = "1";
})();
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && S.account && h !== screen) { screen = h; render(); } });
</script>
